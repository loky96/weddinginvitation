<style>
  body.theme-puzzle { background-color: #faf0dc;

  .kolam-background .kolam { position: absolute; width: clamp(230px, 38vw, 460px); height: auto; opacity: .04; }

  .kolam-background .kolam:nth-child(2) { top: 32%; right: -110px; transform: rotate(-12deg); }
  .kolam-background .kolam:nth-child(3) { bottom: -105px; left: -75px; transform: rotate(24deg); }
  .game, .scroll-wrap { position: relative; z-index: 1; }
  @media (prefers-reduced-motion: reduce) { .kolam-background { transition: none; } }
  .temple-approach { position: fixed; inset: 0; height: 100svh; height: 100dvh; background: #1c0d0a; z-index: 20; }
  .temple-sticky { position: fixed; inset: 0; height: 100svh; height: 100dvh; overflow: hidden; background: #1c0d0a; }
  .temple-sticky::before { content: ''; position: absolute; inset: -24px; background: url('assets/temple-entrance.webp') center / cover;
    filter: blur(22px) brightness(.55); opacity: .8; }
  .temple-art { position: absolute; top: 0; left: 50%; width: 100%; height: auto; aspect-ratio: 1086 / 1448; transform: translateX(-50%); transform-origin: 0 0; will-change: transform; }
  .temple-art img { display: block; width: 100%; height: 100%; }
  .temple-doors { position: absolute; left: 35%; top: 47.5%; width: 33%; height: 37.7%; display: flex; perspective: 900px; background: #432010; }
  /* Crop the transparent gutters from the door artwork so the closed edges meet the stone frame. */
  .temple-leaf { width: 50%; height: 100%; background-image: url('assets/temple-doors.webp'); background-size: 213.3333% 106.815%;
    background-color: #432010; background-repeat: no-repeat; position: relative; z-index: 1; backface-visibility: hidden; will-change: transform; }
  .temple-leaf.left { background-position: 5.8824% 40.8163%; transform-origin: left center; }
  .temple-leaf.right { background-position: 94.1176% 40.8163%; transform-origin: right center; }
  @media (max-width: 768px) and (orientation: portrait) {
    .temple-sticky::before { background-image: url('assets/temple-entrance-mobile.webp'); }
    .temple-art { aspect-ratio: 841 / 1870; }
    .temple-doors { left: 31.4%; top: 59.7%; width: 37.3%; height: 32.6%; }
  }
  .temple-approach.departing { position: fixed; inset: 0; height: 100svh; height: 100dvh; pointer-events: none; transition: opacity 1.1s ease; }
  .temple-approach.departing .temple-leaf { transition: transform 1.1s cubic-bezier(.4, 0, .2, 1); }
  .temple-approach.departing .temple-sticky { position: absolute; inset: 0; }
  .temple-approach.departing.faded { opacity: 0; }
  .skip-entrance { position: absolute; top: max(16px, env(safe-area-inset-top)); right: 18px; padding: 10px 14px; border: 1px solid #fff7e750;
    background: #1e0c0980; color: #fff7e7; font: .75rem var(--body); cursor: pointer; border-radius: 4px; }
  body:not(.entered) .game, body:not(.entered) .scroll-wrap { visibility: hidden; }
  @media (prefers-reduced-motion: reduce) { .temple-approach.departing, .temple-approach.departing .temple-leaf { transition: none; } }

  .game { max-width: 600px; margin: 0 auto; padding: clamp(20px, 4vh, 40px) 20px 12px; text-align: center; }
  .puzzle-border { height: 22px; background: url('assets/kolam-horizontal.svg') center / 48px 22px repeat-x; margin: 0 0 16px; }
  .puzzle-border.bottom { margin: 18px 0 0; }
  @media (max-width: 600px) { .game { padding-left: 10px; padding-right: 10px; } }
  .puzzle-heading { max-width: 460px; margin: 0 auto 10px; }
  .game h1 { font: italic 600 clamp(1.2rem, 4.2vw, 1.55rem)/1.4 var(--serif); margin: 0; text-wrap: balance; }
  #g-title:focus { outline: none; }
  .heading-ornament { display: flex; justify-content: center; margin: 0 0 5px; color: var(--gold); }
  .heading-ornament svg { width: 48px; height: 25px; }
  .footsteps-progress { position: relative; width: min(100%, 360px); height: 52px; margin: 0 auto 6px; }
  .footstep { position: absolute; width: clamp(18px, 4.3vw, 23px); height: auto; opacity: 0;
    transform: translateX(-50%) scale(.65); transition: opacity .45s ease-out, transform .45s ease-out; }
  .footstep.bride { color: var(--maroon); }
  .footstep.groom { color: #956b40; }
  .footstep.is-visible { opacity: .9; transform: translateX(-50%) scale(1); }
  .meeting-heart { position: absolute; left: 50%; top: 0; width: 36px; height: 36px; padding: 6px; box-sizing: content-box; color: var(--maroon);
    opacity: 0; transform: translateX(-50%) scale(.5); transition: opacity .5s ease-out, transform .5s ease-out; }
  .footsteps-progress.is-complete .meeting-heart { opacity: 1; transform: translateX(-50%) scale(1); }
  @media (prefers-reduced-motion: reduce) { .footstep, .meeting-heart { transition: none; } }
  .skip-entrance:focus-visible { outline: 3px solid var(--marigold); outline-offset: 3px; }

  .stage { position: relative; margin: 0 auto; touch-action: manipulation; }
  #board { position: absolute; background: transparent; }
  .done #board, .done .shine { border-radius: 14px; }
  .shine { position: absolute; pointer-events: none; overflow: hidden; border-radius: 2px; z-index: 5; }
  .shine::after { content: ''; position: absolute; inset: -20% auto -20% -60%; width: 45%; transform: skewX(-20deg);
    background: linear-gradient(90deg, transparent, rgba(255,236,180,.75), transparent); opacity: 0; }
  .done .shine::after { animation: sweep 1.4s ease-in-out .7s; }
  @keyframes sweep { 0% { left: -60%; opacity: 1; } 100% { left: 130%; opacity: 1; } }
  .ripple { position: absolute; z-index: 4; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; pointer-events: none;
    border: 3px solid var(--marigold); animation: ripple .7s ease-out forwards; }
  @keyframes ripple { to { transform: scale(7); opacity: 0; border-width: 1px; } }
  .piece.pop canvas { animation: pop .45s ease-out; }
  @keyframes pop { 40% { transform: scale(1.08); filter: brightness(1.35); } }
  .piece { position: absolute; left: 0; top: 0; padding: 0; border: 0; background: none; cursor: grab; touch-action: none; transform-origin: 0 0; z-index: 2;
    filter: drop-shadow(0 4px 5px rgba(0,0,0,.35)); -webkit-tap-highlight-color: transparent; transition: filter .2s; }
  .piece.deal { transition: transform .7s cubic-bezier(.2,1.2,.4,1), opacity .4s; }
  .piece canvas { display: block; }
  .piece.drag { cursor: grabbing; filter: drop-shadow(0 14px 14px rgba(0,0,0,.4)); }
  .piece.glide { transition: transform .55s cubic-bezier(.3,1.3,.5,1), filter .2s; }
  .piece.placed { filter: none; z-index: 1 !important; cursor: default; pointer-events: none; }
  .piece:focus-visible { outline: none; filter: drop-shadow(0 0 4px var(--marigold)) drop-shadow(0 0 4px var(--marigold)); }
  .done .piece { visibility: hidden; }

  .scroll-wrap { padding: 14px 16px 80px; }
  .scroll-wrap:has(.hang:not(.untied)) { padding-bottom: calc(240px + env(safe-area-inset-bottom)); }
  .scroll-wrap .hang { width: min(100%, 560px); min-width: 0; }
  .scroll-wrap .rod, .scroll-wrap .roll { width: 100%; }
  .scroll-wrap .rod::before, .scroll-wrap .roll::before { left: 0; }
  .scroll-wrap .rod::after, .scroll-wrap .roll::after { right: 0; }
  .scroll-wrap .mount { min-width: 0; padding-inline: 0; }
  .scroll-wrap .mount::before, .scroll-wrap .mount::after { width: 10px; background: url('assets/kolam-border.svg') center top / 10px 40px repeat-y; }
  .scroll-wrap .mount::before { left: 1px; }
  .scroll-wrap .mount::after { right: 1px; }
  .scroll-wrap .sheet, .scroll-wrap .paper { min-width: 0; width: 100%; }
  .scroll-wrap .knot .label { border: 0; border-radius: 0; background: transparent; box-shadow: none;
    padding: 6px 4px; font: italic 600 1.15rem/1.35 var(--serif); color: var(--maroon); animation: none; }

    background-image: url('assets/scroll-silk.webp'); background-size: 720px 720px; background-blend-mode: normal; }
  /* Sleek typesetting inside the scroll: smaller, airier type, quiet dividers, no boxes. */
  .paper .festoon { height: 40px; margin: 0; }
  .paper .suzhi { font: 600 1.4rem/1 'Noto Serif Tamil', serif; color: var(--maroon); text-align: center; margin: 6px 0 0; }
  .paper main { position: relative; min-width: 0; margin: 10px clamp(4px, 1.4vw, 10px) 0; padding: 12px clamp(6px, 1.6vw, 12px) 14px; font-size: clamp(13px, 2.7vw, 14.5px); line-height: 1.65;
    border: 0; outline: 0;
    background: transparent; }
  .paper .sec { padding: 18px 0 24px; }
  .paper .qual { color: var(--verm); }
  .paper .person { position: relative; padding: 0 6px; }
  .paper .cal-month { position: relative; display: inline-block; padding: 0 22px; }
  .paper button.day { background: rgba(157,119,76,.08); color: var(--maroon); border: 1px solid #a17a4b; box-shadow: none; animation: none; }
  .paper button.day.hl-wedding { background: rgba(123,7,18,.05); color: var(--maroon) !important; border-color: var(--maroon); }
  .paper .ev-title { display: inline-flex; align-items: center; gap: 10px; }
  .paper .ev-title::after { content: none; }
  .paper .ev-title + .ev-hint { display: none; }
  .paper .event-illustration { display: block; width: clamp(110px, 32vw, 150px); max-width: 100%; height: auto;
    aspect-ratio: 1; object-fit: contain; margin: 12px auto 10px; }
  .paper .qr { padding: 10px; background: transparent; border: 0; border-radius: 0; }
  .paper .qr svg { background: transparent; }
  .paper .lotus-end { display: block; width: 70px; margin: 14px auto 0; }
  .paper p, .paper h3 { text-wrap: balance; overflow-wrap: break-word; }
  .paper .kolam { width: 34px; margin: 0 auto 8px; display: block; }
  .paper .section-kolam { display: block; width: 46px; height: 46px; margin: 0 auto 10px; opacity: .8; }
  .paper h2 { font: 600 .72rem/1.3 var(--body); letter-spacing: .28em; text-transform: uppercase; color: var(--verm); margin: 0 0 14px; }
  .paper h2::after { width: 40px; margin-top: 10px; }
  .paper .lead { font-size: .95rem; max-width: 24ch; margin-bottom: 18px; }
  .paper .person { margin: 16px 0; }
  .paper .name { font-size: clamp(1.4rem, 5vw, 1.8rem); line-height: 1.25; margin: 0; }
  .paper .qual { display: block; font-size: .48em; letter-spacing: .08em; margin-top: 2px; }
  .paper .inst { font-size: .8rem; color: var(--maroon); letter-spacing: .04em; margin: 4px 0 8px; }
  .paper .parents { font-size: .8rem; line-height: 1.55; margin: 0; color: rgba(75,40,28,.78); }
  .paper .parents .parent-detail { font-size: .85em; }
  .paper .with { font-size: 1.25rem; margin: 10px 0; }
  .paper .ev-list { gap: 0; }
  .paper .ev { background: none; border: 0; border-radius: 0; padding: 8px 0 16px; }
  .paper .ev + .ev { border-top: 1px solid rgba(197,139,48,.25); padding-top: 16px; }
  .paper .ev summary { padding: 0; min-height: 0; pointer-events: none; }
  .paper .ev-title { font: italic 600 1.45rem var(--serif); }
  .paper .ev { text-align: center; }
  .paper .when { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0; }
  .paper .chip { display: inline-flex; align-items: center; gap: 7px; padding: 3px 6px; border-radius: 0;
    max-width: 100%; min-width: 0; border: 0; font-size: clamp(.75rem, 2.8vw, .86rem); color: var(--maroon);
    background: transparent; box-shadow: none; }
  .paper .chip + .chip { color: var(--maroon); font-weight: 600; }
  .paper .chip svg { width: 18px; height: 18px; flex: none; color: #916b3c; }
  .paper .chip span:last-child { min-width: 0; overflow-wrap: anywhere; }
  .paper .ev dt { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .paper .ev dd { margin: 0; }
  .paper .ev dd + dt + dd { color: var(--maroon); font-weight: 600; }
  .paper .btns { gap: 8px; margin-top: 12px; }
  .paper .btn, .paper .btn.ghost, .paper .btn.gold { min-height: 44px; max-width: 100%; white-space: normal;
    padding: 9px 16px; border: 1px solid rgba(145,107,60,.5); border-radius: 3px;
    background: rgba(157,119,76,.04); color: var(--maroon); box-shadow: none;
    font: 600 1rem/1.3 var(--serif); transition: background-color .2s, border-color .2s; }
  .paper .btn:hover { transform: none; background: rgba(157,119,76,.12); border-color: #916b3c; box-shadow: none; }
  .paper .btn:focus-visible, .paper button.day:focus-visible { outline: 2px solid var(--maroon); outline-offset: 3px; }
  .paper .note { font-size: .7rem; margin-top: 8px; }
  .paper .cal { width: 100%; max-width: 252px; margin-top: 4px; }
  .paper .cal-month { font: 600 .72rem var(--body); letter-spacing: .3em; margin-bottom: 6px; }
  .paper .cal-grid { grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px 0; }
  .paper .cal-grid b { font-size: .6rem; font-weight: 600; letter-spacing: .04em; }
  .paper .day { min-width: 0; min-height: 30px; font-size: .78rem; padding: 0; }
  .paper button.day { min-width: 0; min-height: 32px; font-size: .82rem; }
  .paper .legend { font-size: .72rem; opacity: .85; }
  .paper .venue-name { font: 600 .9rem/1.4 var(--body); letter-spacing: .1em; margin-bottom: 4px; }
  .paper #venue p:not(.venue-name):not(.at) { font-size: .84rem; line-height: 1.55; }
  .paper .at { font: italic 600 1rem var(--serif); }
  .paper .qr { width: min(160px, 100%); margin-top: 14px; box-shadow: none; }
  .paper .qr rect { fill: transparent; }
  .paper .qr path { fill: var(--maroon); }
  .paper .small { font-size: .74rem; }
  .paper .blessing { font-size: 1.15rem; max-width: 22ch; }
  .paper .kolam .k-lines * { stroke-dasharray: 1; stroke-dashoffset: 1; stroke-width: 3; }
  .paper .in .kolam .k-lines * { animation: draw 1.6s ease-in-out forwards .2s; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .hang:not(.untied) .knot { cursor: grab; touch-action: none; user-select: none; transform: translate(-50%, var(--pull, 0px)); transition: transform .25s ease; }
  .hang:not(.untied) .knot.pulling { cursor: grabbing; transition: none; }

  @keyframes tug { 30% { transform: translateY(6px) rotate(-4deg); } 60% { transform: translateY(-2px) rotate(3deg); } }
  @media (prefers-reduced-motion: reduce) { .paper .kolam .k-lines * { stroke-dashoffset: 0; } }
  @media (max-width: 360px) {
    .scroll-wrap { padding-inline: 12px; }
    .paper h2 { font-size: .68rem; letter-spacing: .18em; }
    .paper .ev-title { font-size: 1.3rem; gap: 6px; }
    .paper .parents, .paper .inst { font-size: .76rem; }
    .paper .chip { gap: 5px; padding: 3px 4px; }
  }
</style>

<body class="theme-puzzle">

<div class="kolam-background" aria-hidden="true"></div>

<section class="temple-approach" aria-label="South Indian temple entrance">
  <div class="temple-sticky">
    <div class="temple-art">
      <picture>
        <source media="(max-width: 768px) and (orientation: portrait)" srcset="assets/temple-entrance-mobile.webp">
        <img src="assets/temple-entrance.webp" width="1086" height="1448" fetchpriority="high" alt="A South Indian temple entrance at sunset, decorated with wedding garlands and glowing lamps">
      </picture>
      <div class="temple-doors" aria-hidden="true">
        <div class="temple-leaf left"></div><div class="temple-leaf right"></div>
      </div>
    </div>
    <button class="skip-entrance" type="button">Skip entrance</button>
  </div>
</section>

<section class="game" aria-labelledby="g-title" inert>
  <div class="puzzle-border" aria-hidden="true"></div>
  <div class="puzzle-heading">
    <div class="heading-ornament" aria-hidden="true"></div>
    <h1 id="g-title" tabindex="-1">Piece together our beginning.</h1>
  </div>
  <div class="footsteps-progress" id="footsteps-progress" role="progressbar" aria-label="Puzzle progress: bride and groom walking towards each other" aria-valuemin="0" aria-valuemax="16" aria-valuenow="0"></div>
  <div class="stage" id="stage">
    <canvas id="board" aria-hidden="true"></canvas>
    <div class="shine" id="shine" aria-hidden="true"></div>
  </div>
  <div class="puzzle-border bottom" aria-hidden="true"></div>
</section>
<section class="scroll-wrap" aria-label="Invitation scroll" inert>
  <div class="hang" id="hang">
    <svg class="hanger" viewBox="0 0 120 46" aria-hidden="true"><circle cx="60" cy="5" r="4" fill="#8a5a14"/><path d="M60 6L8 44M60 6l52 38" stroke="#c0281c" stroke-width="2" fill="none"/></svg>
    <div class="rod" aria-hidden="true"></div>
    <div class="mount">
      <div class="sheet"><div class="paper"><main id="main"></main></div></div>
    </div>
    <div class="roll">
      <span class="band" aria-hidden="true"></span>
      <button class="knot" id="knot" type="button" aria-label="Solve the puzzle, or pull down to untie the scroll. Keyboard: press Arrow Down to open." aria-keyshortcuts="ArrowDown"><span class="label">Solve the puzzle to untie</span></button>
    </div>
  </div>
</section>

<p class="music-credit" style="text-align:center;font-size:10px;padding:0 16px 12px;opacity:.6">Bansuri: <a href="https://commons.wikimedia.org/wiki/File:Bansuri_sample_E_bass.ogg" target="_blank" rel="noopener">Bhairav alap by Prithwin (Prithoo)</a> · Public domain</p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>

<script src="puzzle-images.js"></script>
<script>
  const $main = document.getElementById('main');
  const kolamVariants = ['assets/kolam-diamond.svg', 'assets/kolam-flower.svg', 'assets/kolam-cross.svg'];
  document.querySelector('.kolam-background').innerHTML = Array.from({ length: 3 }, () => '<img class="kolam" src="assets/kolam-flower.svg" alt="">').join('');
  INVITE.render($main, { ornament: '<img class="section-kolam" src="assets/kolam-diamond.svg" width="46" height="46" alt="" aria-hidden="true">' });
  $main.querySelectorAll('.section-kolam').forEach((image, i) => { image.src = kolamVariants[i % kolamVariants.length]; });
  // This version keeps the scroll lean: no sign-off, share row or links to other designs.
  document.querySelectorAll('#main .signoff-h, #main .signoff, #blessings .rule, #share .btns:first-of-type, #share p.small, #date p.small, #date .legend').forEach(el => el.remove());
  document.querySelectorAll('#main .qual').forEach(q => { q.textContent = q.textContent.replace(/^,\s*/, ''); }); // qualifications sit on their own line here
  // Order: Save the Date, then the Celebrations, then the Venue; no share/blessings section.
  $main.insertBefore(document.getElementById('date'), document.getElementById('events'));
  document.getElementById('share').remove();
  // Events: date + time as patterned chips with traditional icons, and a single calendar button.
  const ICON = {
    date: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 10C8.5 7.5 6 8.5 3.5 11M12 10c3.5-2.5 6-1.5 8.5 1M12 10c-2-3-4-3.5-6-3M12 10c2-3 4-3.5 6-3" stroke="#587A37" stroke-width="1.6" fill="none" stroke-linecap="round"/><circle cx="12" cy="7" r="2.6" fill="#8a5a14"/><path d="M9 11h6v2H9z" fill="#b9822a"/><path d="M6.5 13h11c0 5-2.6 8-5.5 8s-5.5-3-5.5-8z" fill="#d9a144" stroke="#8a5a14" stroke-width=".8"/><path d="M8 16.5h8" stroke="#7B0712" stroke-width="1.2" stroke-dasharray="1 1.5"/></svg>',
    time: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4c2.4 3 2.6 5.6 0 8-2.6-2.4-2.4-5 0-8z" fill="#ff9a1f"/><path d="M12 7.5c1 1.3 1 2.6 0 3.6-1-1-1-2.3 0-3.6z" fill="#fff3c4"/><path d="M3.5 14h17c-.8 4.5-4.2 6.5-8.5 6.5S4.3 18.5 3.5 14z" fill="#b5532a"/><path d="M3.5 14h17" stroke="#d98450" stroke-width="1.4"/><path d="M7 17h.1M10 17.8h.1M14 17.8h.1M17 17h.1" stroke="#fff3d6" stroke-width="1.6" stroke-linecap="round"/></svg>',
  };
  INVITE.events.forEach(ev => {
    const card = document.getElementById('ev-' + ev.id);
    card.querySelector('dl').outerHTML = `<div class="when">
        <span class="chip"><span class="sr-only">Date: </span>${ICON.date}<span>${ev.displayDate}</span></span>
        <span class="chip"><span class="sr-only">Time: </span>${ICON.time}<span>${ev.displayTime}</span></span>
      </div>`;
    const picture = document.createElement('img');
    picture.className = 'event-illustration';
    picture.src = ev.id === 'reception' ? 'assets/reception-symbol.webp' : 'assets/wedding-symbol.webp';
    picture.alt = ev.id === 'reception'
      ? 'A camera with jasmine flowers and roses for the reception'
      : 'A sacred homam fire with a kalash and jasmine garland for the wedding ceremony';
    picture.width = picture.height = 320;
    picture.loading = 'lazy';
    card.querySelector('.when').before(picture);
    card.querySelectorAll('a[download], .note').forEach(el => el.remove());
    card.querySelector('.btn').textContent = 'Add to Calendar';
  });
  // Traditional ornaments: thoranam, Pillaiyar suzhi, section kolam, and a closing lotus.
  const LOTUS = '<svg viewBox="0 0 92 48" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M46 44c-10-6-14-16-12-30 6 8 10 18 12 30zM46 44c10-6 14-16 12-30-6 8-10 18-12 30zM46 44c-4-12-2-24 0-34 2 10 4 22 0 34z"/><path d="M46 44c-14 0-24-6-30-16 10 2 20 8 30 16zM46 44c14 0 24-6 30-16-10 2-20 8-30 16z"/><path d="M14 44h64" stroke-width="1.2"/></g><circle cx="46" cy="44" r="2.4" fill="#B32A1C"/></svg>';
  const paper = document.querySelector('.paper');
  document.querySelector('.heading-ornament').innerHTML = LOTUS;
  paper.insertAdjacentHTML('afterbegin', '<div class="festoon" aria-hidden="true"></div><p class="suzhi" lang="ta" aria-hidden="true">உ</p>');
  $main.querySelector('.blessing').insertAdjacentHTML('afterend', LOTUS.replace('class="', 'class="lotus-end ').replace('<svg ', '<svg class="lotus-end" style="color:var(--gold)" '));

  const hang = document.getElementById('hang'), knot = document.getElementById('knot');
  knot.insertAdjacentHTML('afterbegin', INVITE.art.knot);
  hang.querySelector('.sheet').inert = true;

  const $ = id => document.getElementById(id);
  const stage = $('stage'), board = $('board');
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const n = 4;
  const footstepsProgress = $('footsteps-progress');
  const FOOTPRINT = '<g fill="currentColor"><path d="M12 17c-4 2-6 8-5 13l2 12c1 5 8 6 11 2 2-3 1-6 0-9l-2-7c-1-3 2-6 0-9-1-2-4-3-6-2Z"/><ellipse cx="20" cy="9" rx="3.7" ry="4.5"/><ellipse cx="12.5" cy="6.5" rx="2.7" ry="3.4"/><ellipse cx="7" cy="8" rx="2.3" ry="2.8"/><ellipse cx="3.5" cy="12" rx="1.9" ry="2.4"/><ellipse cx="2.8" cy="17" rx="1.5" ry="2"/></g>';
  footstepsProgress.innerHTML = Array.from({ length: n * n }, (_, i) => {
    const bride = i % 2 === 0, step = Math.floor(i / 2);
    const flip = bride ? step % 2 === 1 : step % 2 === 0;
    const along = step / 7, percent = 4 + 46 * along, inset = 44 * along;
    const x = `calc(${bride ? percent : 100 - percent}% ${bride ? '-' : '+'} ${inset}px)`;
    return `<svg class="footstep ${bride ? 'bride' : 'groom'}" viewBox="0 0 50 32" aria-hidden="true" style="left:${x};top:${step % 2 ? 27 : 8}px">
      <g transform="${flip ? 'translate(0 32) scale(1 -1)' : ''}"><g transform="${bride ? 'translate(50 0) rotate(90)' : 'translate(0 32) rotate(-90)'}">${FOOTPRINT}</g></g>
    </svg>`;
  }).join('') + '<svg class="meeting-heart" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 21 3.5 12.5C-2 7 6 0 12 6c6-6 14 1 8.5 6.5Z"/></svg>';
  let pieces = [], geo, drag = null, zTop = 10, cover;
  const puzzleImagePaths = window.PUZZLE_IMAGES?.length ? window.PUZZLE_IMAGES : ['assets/puzzle-image.webp'];
  const selectedPuzzleImage = puzzleImagePaths[Math.floor(Math.random() * puzzleImagePaths.length)];
  const puzzleImage = new Image();
  let fallbackUsed = selectedPuzzleImage === 'assets/puzzle-image.webp';
  const puzzleImageReady = new Promise((resolve, reject) => {
    puzzleImage.onload = resolve;
    puzzleImage.onerror = () => {
      if (!fallbackUsed) { fallbackUsed = true; puzzleImage.src = 'assets/puzzle-image.webp'; }
      else reject(new Error('The puzzle image could not be loaded.'));
    };
  });
  puzzleImage.src = selectedPuzzleImage;
  addEventListener('temple-entered', () => { if (geo) build(); });

  function drawCover(g, S) {
    const scale = Math.min(S / puzzleImage.naturalWidth, S / puzzleImage.naturalHeight);
    const width = puzzleImage.naturalWidth * scale, height = puzzleImage.naturalHeight * scale;
    g.fillStyle = '#fffaf0';
    g.fillRect(0, 0, S, S);
    g.drawImage(puzzleImage, (S - width) / 2, (S - height) / 2, width, height);
  }

  // Jigsaw edge from (x0,y0) to (x1,y1). Clockwise traversal → normal points inward; s=-1 bulges out, s=1 in.
  function edge(p, x0, y0, x1, y1, s) {
    if (!s) return p.lineTo(x1, y1);
    const dx = x1 - x0, dy = y1 - y0;
    const P = (a, b) => [x0 + dx * a - dy * b * s, y0 + dy * a + dx * b * s];
    p.lineTo(...P(.38, 0));
    p.bezierCurveTo(...P(.42, .06), ...P(.28, .22), ...P(.5, .22));
    p.bezierCurveTo(...P(.72, .22), ...P(.58, .06), ...P(.62, 0));
    p.lineTo(x1, y1);
  }

  const rnd = () => (Math.random() < .5 ? 1 : -1);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  function setPos(p, x, y) {
    p.x = x; p.y = y;
    const h = geo.W / 2;
    p.el.style.transform = `translate(${x}px, ${y}px) scale(${p.s}) translate(${h}px, ${h}px) rotate(${p.rot || 0}deg) translate(${-h}px, ${-h}px)`;
  }

  // Phones use a grid below the board; larger screens scatter pieces around it.
  function scatter(p, slot) {
    const { SW, W, S, cell, boardX, boardY, mobile, looseScale, trayTop } = geo;
    p.slot = slot;
    p.s = looseScale;
    if (mobile) {
      const w = W * p.s, pitch = w + 10, row = Math.floor(slot / 4);
      const start = (SW - (4 * w + 30)) / 2;
      const stagger = [-7, 5, -3, 7][row];
      p.rot = (Math.random() - .5) * 16;
      p.home = [start + (slot % 4) * pitch + stagger + (Math.random() - .5) * 6,
        trayTop + 12 + row * pitch + (Math.random() - .5) * 6];
      setPos(p, ...p.home);
      return;
    }
    const w = W * p.s, side = Math.floor(slot / 4), i = slot % 4;
    const along = i * cell + (cell - w) / 2;
    const offset = (boardX - w) / 2 + (Math.random() - .5) * boardX * .08;
    p.rot = (Math.random() - .5) * 6;
    p.home = side === 0 ? [boardX + along, offset]
      : side === 1 ? [boardX + S + offset, boardY + along]
      : side === 2 ? [boardX + along, boardY + S + offset]
      : [offset, boardY + along];
    setPos(p, ...p.home);
  }

  function fitTray(count) {
    if (geo.mobile) stage.style.height = (geo.trayTop + 18 + Math.ceil(count / 4) * (geo.W * geo.looseScale + 10)) + 'px';
  }

  function reflowLoosePieces() {
    const loose = pieces.filter(p => !p.placed).sort((a, b) => a.slot - b.slot);
    loose.forEach((p, slot) => {
      p.el.classList.add('glide');
      scatter(p, slot);
    });
    if (loose.length) fitTray(loose.length);
  }

  function build(keep = new Set()) {
    if (!puzzleImage.complete || !puzzleImage.naturalWidth) return;
    const mobile = innerWidth <= 600;
    const SW = Math.max(220, Math.min(stage.parentElement.clientWidth - (mobile ? 20 : 40), mobile ? 560 : 520));
    const S = mobile ? SW - 16 : SW * .64, cell = S / n, t = .22 * cell, W = cell + 2 * t;
    const boardX = (SW - S) / 2, boardY = mobile ? t + 8 : boardX;
    const looseScale = mobile ? .56 : .66, trayTop = boardY + S + (mobile ? 14 : 28);
    const stageH = mobile ? trayTop + 4 * W * looseScale + 58 : SW;
    geo = { SW, S, t, cell, W, boardX, boardY, mobile, looseScale, trayTop, stageH };
    stage.style.width = SW + 'px';
    stage.style.height = stageH + 'px';
    stage.classList.remove('done');

    cover = document.createElement('canvas');
    cover.width = cover.height = S * dpr;
    const cg = cover.getContext('2d');
    cg.scale(dpr, dpr);
    drawCover(cg, S);
    for (const el of [board, $('shine')]) Object.assign(el.style, { left: boardX + 'px', top: boardY + 'px', width: S + 'px', height: S + 'px' });
    board.width = board.height = S * dpr;

    const H = Array.from({ length: n - 1 }, () => Array.from({ length: n }, rnd));
    const V = Array.from({ length: n }, () => Array.from({ length: n - 1 }, rnd));
    stage.querySelectorAll('.piece').forEach(e => e.remove());
    pieces = [];

    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
      const out = [r ? -H[r - 1][c] : 0, c < n - 1 ? V[r][c] : 0, r < n - 1 ? H[r][c] : 0, c ? -V[r][c - 1] : 0];
      const path = new Path2D();
      path.moveTo(t, t);
      edge(path, t, t, t + cell, t, -out[0]);
      edge(path, t + cell, t, t + cell, t + cell, -out[1]);
      edge(path, t + cell, t + cell, t, t + cell, -out[2]);
      edge(path, t, t + cell, t, t, -out[3]);
      path.closePath();

      const cv = document.createElement('canvas');
      cv.width = cv.height = Math.ceil(W * dpr);
      cv.style.width = cv.style.height = W + 'px';
      const g = cv.getContext('2d');
      g.scale(dpr, dpr);

      const el = document.createElement('button');
      el.type = 'button';
      el.className = 'piece';
      el.setAttribute('aria-label', `Puzzle piece row ${r + 1}, column ${c + 1}. Press Enter to place it.`);
      el.append(cv);
      stage.append(el);
      const p = { el, g, r, c, path, tx: boardX + c * cell - t, ty: boardY + r * cell - t, placed: false, s: .66 };
      paint(p, true);
      pieces.push(p);
      if (keep.has(r * n + c)) place(p, false);
    }
    const loose = pieces.filter(p => !p.placed);
    const slots = [...Array(loose.length).keys()].sort(() => Math.random() - .5);
    if (loose.length) fitTray(loose.length);
    // Deal pieces from the frame's centre to the spaces around it.
    loose.forEach(p => { p.s = .2; p.el.style.opacity = 0; setPos(p, SW / 2 - W * .1, SW / 2 - W * .1); });
    requestAnimationFrame(() => requestAnimationFrame(() => loose.forEach((p, i) => {
      p.el.classList.add('deal');
      p.el.style.transitionDelay = i * 45 + 'ms';
      p.el.style.opacity = '';
      scatter(p, slots[i]);
      setTimeout(() => { p.el.classList.remove('deal'); p.el.style.transitionDelay = ''; }, 800 + i * 45);
    })));
    // Shuffle tab order too, so keyboard users don't get pieces in solved order.
    pieces.slice().sort(() => Math.random() - .5).forEach(p => p.el.parentNode.append(p.el));
    pieces.filter(p => p.placed).forEach(p => p.el.parentNode.prepend(p.el));
    update(false);
  }

  // Cut the piece's share of the artwork; loose pieces get a thin gold edge, placed ones sit seamless.
  function paint(p, outline) {
    const { S, t, cell, W } = geo, g = p.g;
    g.clearRect(0, 0, W, W);
    g.save(); g.clip(p.path);
    g.drawImage(cover, t - p.c * cell, t - p.r * cell, S, S);
    g.restore();
    if (outline) { g.strokeStyle = 'rgba(255,226,160,.85)'; g.lineWidth = 1.2; g.stroke(p.path); }
  }

  // Empty board: dotted outlines only for slots still waiting for their piece (no picture until solved).
  function drawBoard() {
    const { S, t, cell } = geo, bg = board.getContext('2d');
    bg.setTransform(dpr, 0, 0, dpr, 0, 0);
    bg.clearRect(0, 0, S, S);
    bg.setLineDash([2, 5]);
    bg.lineCap = 'round';
    bg.lineWidth = 1.2;
    bg.strokeStyle = 'rgba(123,7,18,.08)';
    pieces.filter(p => !p.placed).forEach(p => {
      bg.save(); bg.translate(p.c * cell - t, p.r * cell - t); bg.stroke(p.path); bg.restore();
    });
    bg.strokeRect(.6, .6, S - 1.2, S - 1.2);
  }

  function update(animate) {
    if (!stage.classList.contains('done')) drawBoard();
    const done = pieces.filter(p => p.placed).length, total = n * n;
    footstepsProgress.querySelectorAll('.footstep').forEach((step, i) => step.classList.toggle('is-visible', i < done));
    footstepsProgress.classList.toggle('is-complete', done === total);
    footstepsProgress.setAttribute('aria-valuenow', String(done));
    footstepsProgress.setAttribute('aria-valuetext', `${done} of ${total} pieces placed. ${done === total ? 'The bride and groom have met.' : 'The bride and groom are walking towards each other.'}`);
    if (done === total) complete(animate);
  }

  function place(p, animate = true) {
    p.placed = true;
    p.s = 1;
    paint(p, false);
    p.el.disabled = true;
    p.el.classList.add('placed');
    p.rot = 0;
    p.el.classList.toggle('glide', animate);
    setPos(p, p.tx, p.ty);
    if (animate) {
      reflowLoosePieces();
      window.InvitationSound?.play('piece', pieces.filter(piece => piece.placed).length);
      setTimeout(() => {
        p.el.classList.add('pop');
        const ring = document.createElement('span');
        ring.className = 'ripple';
        ring.style.left = p.tx + geo.W / 2 + 'px';
        ring.style.top = p.ty + geo.W / 2 + 'px';
        stage.append(ring);
        setTimeout(() => ring.remove(), 750);
        const R = stage.getBoundingClientRect();
        INVITE.petals(R.left + p.tx + geo.W / 2, R.top + p.ty + geo.W / 2, 7);
      }, p.el.classList.contains('glide') && !drag ? 250 : 0);
      update(true);
    }
  }

  function complete(animate) {
    const alreadyDone = stage.classList.contains('done');
    board.getContext('2d').drawImage(cover, 0, 0, geo.S, geo.S);
    stage.classList.add('done');
    stage.style.height = geo.mobile ? geo.boardY + geo.S + 12 + 'px' : geo.stageH + 'px';
    knot.setAttribute('aria-label', 'Scroll down to open the invitation, or untie the cord');
    knot.querySelector('.label').textContent = 'Scroll down to open';
    lastScrollY = scrollY;
    if (!animate || alreadyDone) return;
    window.InvitationSound?.play('complete');
    [0, 350, 700].forEach((d, i) => setTimeout(() => INVITE.petals(innerWidth * (.2 + .3 * i), -20, 22, innerHeight + 100), d));
  }

  function openScroll(delay) {
    knot.setAttribute('aria-label', 'Untie the cord to unroll the invitation');
    knot.querySelector('.label').textContent = 'Untie the cord';
    setTimeout(() => {
      hang.scrollIntoView({ behavior: INVITE.reduced ? 'auto' : 'smooth', block: 'start' });
      setTimeout(revealScroll, delay ? 700 : 0);
    }, delay);
  }

  function revealScroll() {
    if (hang.classList.contains('untied')) return;
    window.InvitationSound?.play('scroll');
    INVITE.unroll(hang);
  }

  let lastScrollY = 0;
  addEventListener('scroll', () => {
    const down = scrollY > lastScrollY;
    lastScrollY = scrollY;
    if (!down || !stage.classList.contains('done') || hang.classList.contains('untied')) return;
    const rect = hang.getBoundingClientRect();
    if (rect.top < innerHeight * .85 && rect.bottom > 0) revealScroll();
  }, { passive: true });

  // Pull the cord 80 CSS pixels to open early; shorter pulls spring back.
  let knotPull = null, suppressKnotClick = false;
  function finishKnotPull(open) {
    if (!knotPull) return;
    const { id, distance } = knotPull;
    knotPull = null;
    suppressKnotClick = open || distance > 8;
    knot.classList.remove('pulling');
    knot.style.removeProperty('--pull');
    if (knot.hasPointerCapture(id)) knot.releasePointerCapture(id);
    if (open) openScroll(0);
  }
  knot.addEventListener('pointerdown', e => {
    if (e.button !== 0 || knotPull || hang.classList.contains('untied')) return;
    e.preventDefault();
    suppressKnotClick = false;
    knotPull = { id: e.pointerId, startY: e.clientY, distance: 0 };
    knot.setPointerCapture(e.pointerId);
    knot.classList.add('pulling');
  });
  knot.addEventListener('pointermove', e => {
    if (!knotPull || e.pointerId !== knotPull.id) return;
    knotPull.distance = Math.max(0, e.clientY - knotPull.startY);
    knot.style.setProperty('--pull', Math.min(knotPull.distance, 112) + 'px');
    if (knotPull.distance >= 80) finishKnotPull(true);
  });
  knot.addEventListener('pointerup', e => {
    if (!knotPull || e.pointerId !== knotPull.id) return;
    finishKnotPull(Math.max(0, e.clientY - knotPull.startY) >= 80);
  });
  knot.addEventListener('pointercancel', e => {
    if (knotPull && e.pointerId === knotPull.id) finishKnotPull(false);
  });
  knot.addEventListener('lostpointercapture', e => {
    if (knotPull && e.pointerId === knotPull.id) finishKnotPull(false);
  });
  knot.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' && !hang.classList.contains('untied')) {
      e.preventDefault();
      openScroll(0);
    }
  });
  knot.addEventListener('click', e => {
    if (suppressKnotClick) { suppressKnotClick = false; e.preventDefault(); return; }
    if (hang.classList.contains('untied')) return;
    if (stage.classList.contains('done')) return revealScroll();
    knot.classList.remove('nudge'); void knot.offsetWidth; knot.classList.add('nudge');
    INVITE.toast('Solve the puzzle, or pull the cord down to open');
  });

  // Use the jigsaw path for picking, including when local image canvases disallow pixel reads.
  function pieceAt(x, y) {
    const R = stage.getBoundingClientRect();
    for (const el of document.elementsFromPoint(x, y)) {
      const p = pieces.find(q => q.el === el && !q.placed);
      if (!p) continue;
      const half = geo.W / 2, angle = -(p.rot || 0) * Math.PI / 180;
      const dx = (x - R.left - p.x) / p.s - half, dy = (y - R.top - p.y) / p.s - half;
      const lx = (dx * Math.cos(angle) - dy * Math.sin(angle) + half) * dpr;
      const ly = (dx * Math.sin(angle) + dy * Math.cos(angle) + half) * dpr;
      if (lx < 0 || ly < 0 || lx >= p.g.canvas.width || ly >= p.g.canvas.height) continue;
      if (p.g.isPointInPath(p.path, lx, ly)) return p;
    }
  }

  stage.addEventListener('pointerdown', e => {
    if (!e.target.closest('.piece')) return;
    const p = pieceAt(e.clientX, e.clientY);
    if (!p) return;
    e.preventDefault();
    p.el.setPointerCapture(e.pointerId);
    p.el.classList.remove('glide');
    p.el.classList.add('drag');
    p.el.style.zIndex = ++zTop;
    const R = stage.getBoundingClientRect(), px = e.clientX - R.left, py = e.clientY - R.top;
    const lx = (px - p.x) / p.s, ly = (py - p.y) / p.s;
    p.s = 1;
    setPos(p, px - lx, py - ly);
    drag = { p, lx, ly };
  });
  stage.addEventListener('pointermove', e => {
    if (!drag) return;
    const R = stage.getBoundingClientRect();
    drag.p.rot = clamp((drag.p.rot || 0) * .7 + e.movementX * .9, -14, 14); // tilt with drag speed
    setPos(drag.p, e.clientX - R.left - drag.lx, e.clientY - R.top - drag.ly);
  });
  const endDrag = () => {
    if (!drag) return;
    const { p } = drag;
    drag = null;
    p.el.classList.remove('drag');
    p.el.classList.add('glide');
    p.rot = 0;
    if (Math.hypot(p.x - p.tx, p.y - p.ty) < geo.cell * .3) return place(p);
    p.s = geo.looseScale;
    setPos(p, ...p.home);
  };
  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', endDrag);

  // Keyboard: Enter/Space on a focused piece places it.
  stage.addEventListener('click', e => {
    const p = pieces.find(q => q.el === e.target.closest('.piece'));
    if (p && !p.placed && e.detail === 0) { p.el.style.zIndex = ++zTop; place(p); }
  });

  let lastW = 0, lastMobile = innerWidth <= 600;
  addEventListener('resize', () => {
    const w = stage.parentElement.clientWidth;
    const mobile = innerWidth <= 600;
    if (w === lastW && mobile === lastMobile) return;
    lastW = w;
    lastMobile = mobile;
    clearTimeout(build._t);
    build._t = setTimeout(() => build(new Set(pieces.filter(p => p.placed).map(p => p.r * n + p.c))), 200);
  });

  // Wait for the supplied artwork before cutting its sixteen pieces.
  puzzleImageReady.then(() => {
    lastW = stage.parentElement.clientWidth;
    build();
    // Preview control: puzzle.html?solved fills every piece in turn so you can check the finished state.
    if (new URLSearchParams(location.search).has('solved')) {
      pieces.filter(p => !p.placed).forEach((p, i) => setTimeout(() => { p.el.style.zIndex = ++zTop; place(p); }, 900 + i * 120));
    }
  }).catch(() => {
    const message = document.createElement('p');
    message.setAttribute('role', 'alert');
    message.textContent = 'The puzzle image could not load. Please refresh to try again.';
    stage.replaceChildren(message);
  });
</script>
</body>
</html>
