name: Deploy invitation to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out invitation
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build invitation
        run: node scripts/build-site.cjs
      - name: Test invitation
        run: node --test tests/*.test.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload invitation
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publish invitation
        id: deployment
        uses: actions/deploy-pages@v4
